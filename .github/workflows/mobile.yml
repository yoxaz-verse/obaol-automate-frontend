name: Mobile

on:
  pull_request:
    paths: ["mobile/**", "src/components/Login/**", "src/utils/mobileAuthBridge.ts", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "src/components/Login/**", "src/utils/mobileAuthBridge.ts", ".github/workflows/mobile.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release --dart-define=APP_URL=https://www.obaol.com/auth --dart-define=API_BASE_URL=https://api.obaol.com/api/v1/web

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=APP_URL=https://www.obaol.com/auth --dart-define=API_BASE_URL=https://api.obaol.com/api/v1/web
