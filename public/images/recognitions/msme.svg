<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <!-- MSME Gear & Ashoka Sun emblem -->
  <g transform="translate(6, 6)">
    <!-- Gear outer teeth ring -->
    <circle cx="24" cy="24" r="20" fill="none" stroke="#002B49" stroke-width="3" stroke-dasharray="6 3"/>
    <!-- Inner Tricolor rings -->
    <circle cx="24" cy="24" r="15" fill="#FF9933"/>
    <circle cx="24" cy="24" r="11" fill="#FFFFFF"/>
    <circle cx="24" cy="24" r="7" fill="#138808"/>
    <!-- Center Ashoka Blue Wheel -->
    <circle cx="24" cy="24" r="4" fill="#002B49"/>
    <path d="M24 18 L24 30 M18 24 L30 24 M20 20 L28 28 M20 28 L28 20" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>
  <!-- MSME Typography -->
  <g transform="translate(62, 0)">
    <text x="0" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="0.5" fill="#002B49">MSME</text>
    <text x="0" y="46" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" letter-spacing="0.4" fill="#D97706">MINISTRY OF MICRO, SMALL &amp; MEDIUM ENTERPRISES</text>
  </g>
</svg>