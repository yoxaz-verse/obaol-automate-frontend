<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <defs>
    <filter id="ink-edge" x="-12%" y="-16%" width="124%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.024" numOctaves="4" seed="23" result="paper" />
      <feDisplacementMap in="SourceGraphic" in2="paper" scale="34" xChannelSelector="R" yChannelSelector="B" result="rough" />
      <feGaussianBlur in="rough" stdDeviation="4.5" />
    </filter>
    <filter id="soft-drop" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>
  <rect x="48" y="42" width="1104" height="716" rx="62" fill="white" filter="url(#ink-edge)" />
