<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBAOL Supreme — Opening</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #000; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      html { transition: opacity .3s ease, filter .3s ease; }
      html.is-leaving { opacity: 0; filter: blur(5px); }
      body { margin: 0; overflow: hidden; background: #000; color: #f7f1e6; }
      .opening { position: relative; width: 100%; height: 100%; min-height: 480px; overflow: hidden; isolation: isolate; background: #000; }
      .ambient { position: absolute; z-index: 0; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(204,145,45,.11), transparent 19%), radial-gradient(ellipse at 50% 52%, rgba(153,101,20,.045), transparent 42%); opacity: 0; animation: ambient-in 1.2s ease-out .08s forwards; }
      .center-point { position: absolute; z-index: 2; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: #e2aa4a; box-shadow: 0 0 20px 7px rgba(218,157,54,.5); opacity: 0; transform: translate(-50%, -50%) scale(.2); animation: point-in .5s ease-out .08s forwards, point-out .45s ease-in .72s forwards; }
      .sunburst { position: absolute; z-index: 1; left: 50%; top: 50%; width: 160vmax; height: 160vmax; overflow: visible; transform: translate(-50%, -50%); filter: drop-shadow(0 0 4px rgba(219,158,56,.2)); }
      .ray { fill: none; stroke: rgba(220,164,72,var(--ray-opacity)); stroke-width: var(--ray-width); stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 1; stroke-dashoffset: 1; animation: ray-out 1.3s cubic-bezier(.18,.72,.2,1) var(--ray-delay) forwards; }
      .logo-stage { position: absolute; z-index: 3; left: 50%; top: 50%; width: min(45vw, 500px); padding: clamp(18px, 3vw, 42px); transform: translate(-50%, -50%) scale(.92); opacity: 0; filter: blur(8px); background: radial-gradient(ellipse at center, #000 58%, rgba(0,0,0,.96) 72%, transparent 100%); animation: logo-resolve 1.05s cubic-bezier(.16,.82,.22,1) .72s forwards; }
      .logo-frame { position: relative; overflow: hidden; }
      .logo { display: block; width: 100%; height: auto; object-fit: contain; }
      .logo-frame::after { content: ""; position: absolute; inset: -35% -45%; background: linear-gradient(108deg, transparent 39%, rgba(255,232,178,.55) 49%, transparent 59%); mix-blend-mode: screen; transform: translateX(-115%); animation: logo-sweep .85s ease-in-out 1.35s forwards; }
      .particle { position: absolute; z-index: 2; left: 50%; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: #dca448; opacity: 0; box-shadow: 0 0 8px rgba(220,164,72,.6); }
      .particle.p1 { --x: -260px; --y: -105px; animation: particle-out 1.35s ease-out .72s forwards; }
      .particle.p2 { --x: 280px; --y: -70px; animation: particle-out 1.5s ease-out .82s forwards; }
      .particle.p3 { --x: -220px; --y: 115px; animation: particle-out 1.4s ease-out .92s forwards; }
      .particle.p4 { --x: 245px; --y: 125px; animation: particle-out 1.55s ease-out .78s forwards; }
      .status { position: absolute; z-index: 4; right: 0; bottom: 7%; left: 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: rgba(244,231,203,.42); font-size: 9px; font-weight: 800; letter-spacing: .27em; text-transform: uppercase; opacity: 0; animation: status-in .6s ease-out 1.95s forwards; }
      .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #d29d42; box-shadow: 0 0 13px rgba(210,157,66,.75); animation: breathe 1.5s ease-in-out 2.2s infinite; }
      .grain { position: absolute; z-index: 5; inset: 0; pointer-events: none; opacity: .028; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); }
      @keyframes ambient-in { to { opacity: 1; } }
      @keyframes point-in { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
      @keyframes point-out { to { opacity: .2; transform: translate(-50%, -50%) scale(3); } }
      @keyframes ray-out { 0% { opacity: 0; stroke-dashoffset: 1; } 18% { opacity: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
      @keyframes logo-resolve { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.92); filter: blur(8px); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); } }
      @keyframes logo-sweep { to { transform: translateX(115%); } }
      @keyframes particle-out { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); } 25% { opacity: .7; } 100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1); } }
      @keyframes status-in { to { opacity: 1; } }
      @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
      @media (max-aspect-ratio: 4 / 3) { .logo-stage { width: min(58vw, 470px); } }
      @media (prefers-reduced-motion: reduce) {
        html { transition-duration: .15s; }
        .ambient, .center-point, .ray, .logo-stage, .logo-frame::after, .particle, .status, .status::before { animation: none; }
        .ambient { opacity: 1; }
        .center-point, .particle { display: none; }
        .ray { opacity: .52; stroke-dashoffset: 0; }
        .logo-stage { opacity: 1; transform: translate(-50%, -50%); filter: none; }
        .status { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main class="opening" role="status" aria-live="polite" aria-label="Opening OBAOL Supreme">
      <div class="ambient" aria-hidden="true"></div>
      <div class="center-point" aria-hidden="true"></div>
      <svg class="sunburst" viewBox="-1000 -1000 2000 2000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <section class="logo-stage" aria-label="OBAOL"><div class="logo-frame"><img class="logo" src="../build/splash-logo.webp" alt="OBAOL" /></div></section>
      <i class="particle p1" aria-hidden="true"></i><i class="particle p2" aria-hidden="true"></i>
      <i class="particle p3" aria-hidden="true"></i><i class="particle p4" aria-hidden="true"></i>
      <div class="status" aria-hidden="true">Preparing your secure workspace</div>
      <div class="grain" aria-hidden="true"></div>
      <audio id="opening-chime" src="../build/opening-chime.wav" preload="auto" aria-hidden="true"></audio>
    </main>
    <script>
      (() => {
        const sunburst = document.querySelector(".sunburst");
        const svgNamespace = "http://www.w3.org/2000/svg";
        const rayCount = 48;
        for (let index = 0; index < rayCount; index += 1) {
          const angle = (Math.PI * 2 * index) / rayCount - Math.PI / 2;
          const primary = index % 4 === 0;
          const radius = primary ? 1000 : index % 2 === 0 ? 930 : 860;
          const ray = document.createElementNS(svgNamespace, "line");
          ray.setAttribute("class", "ray");
          ray.setAttribute("x1", "0");
          ray.setAttribute("y1", "0");
          ray.setAttribute("x2", String(Math.cos(angle) * radius));
          ray.setAttribute("y2", String(Math.sin(angle) * radius));
          ray.setAttribute("pathLength", "1");
          ray.style.setProperty("--ray-width", primary ? "1.35" : index % 2 === 0 ? ".9" : ".65");
          ray.style.setProperty("--ray-opacity", primary ? ".52" : index % 2 === 0 ? ".32" : ".2");
          ray.style.setProperty("--ray-delay", `${0.34 + (index % 6) * 0.035}s`);
          sunburst.appendChild(ray);
        }
        const chime = document.getElementById("opening-chime");
        chime.volume = 0.28;
        const play = () => chime.play().catch(() => {});
        if (document.readyState === "complete") play();
        else window.addEventListener("load", play, { once: true });
      })();
    </script>
  </body>
</html>
