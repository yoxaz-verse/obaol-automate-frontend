<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fcfaf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
  <title>OBAOL — Offline</title>
  <style>
    :root{color-scheme:light dark;--bg:#fcfaf6;--surface:rgba(255,255,255,.9);--solid:#fff;--inset:#f5f1e9;--text:#192321;--muted:#59635e;--border:#e4e3dc;--accent:#cf983c;--accent-hover:#dfac54;--accent-text:#211b10;--success:#28704d;--shadow:0 28px 80px -42px rgba(25,35,33,.36);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;min-height:100vh;min-height:100dvh;overflow-x:hidden;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:radial-gradient(circle at 15% 18%,rgba(207,152,60,.13),transparent 30rem),radial-gradient(circle at 88% 80%,rgba(40,112,77,.08),transparent 28rem),var(--bg)}
    .network{position:fixed;inset:0;width:100%;height:100%;color:var(--accent);opacity:.14;pointer-events:none}
    main{position:relative;width:min(100%,520px);overflow:hidden;border:1px solid var(--border);border-radius:28px;background:var(--surface);padding:clamp(28px,6vw,48px);text-align:center;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
    main::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
    .offline-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;justify-content:center;width:132px;min-height:58px;padding:9px 15px;border:1px solid var(--border);border-radius:14px;background:var(--solid)}
    .brand img{display:block;width:100%;height:40px;object-fit:contain}
    .status{display:flex;align-items:center;gap:8px;min-height:32px;padding:6px 12px;border:1px solid color-mix(in srgb,var(--accent) 36%,var(--border));border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:color-mix(in srgb,var(--accent) 72%,var(--text));font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}
    .status-dot{width:8px;height:8px;flex:none;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 14%,transparent)}
    h1{margin:0;font-size:clamp(32px,8vw,46px);line-height:1.08;letter-spacing:-.045em;text-wrap:balance}
    .lead{max-width:38ch;margin:18px auto 0;color:var(--muted);font-size:clamp(15px,3vw,17px);line-height:1.7;text-wrap:pretty}
    .privacy{display:flex;align-items:flex-start;gap:10px;margin:26px 0 0;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--inset);color:var(--muted);text-align:left;font-size:13px;line-height:1.55}
    .privacy svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--success)}
    button{width:100%;min-height:50px;margin-top:22px;border:1px solid transparent;border-radius:12px;background:linear-gradient(135deg,var(--accent),#dca848);color:var(--accent-text);cursor:pointer;font:inherit;font-size:15px;font-weight:800;box-shadow:0 10px 26px -14px rgba(148,99,28,.75);transition:transform 160ms ease,background 160ms ease,box-shadow 160ms ease}
    button:hover{background:var(--accent-hover);box-shadow:0 14px 30px -15px rgba(148,99,28,.9)}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:3px}button:disabled{cursor:wait;opacity:.72}
    .feedback{min-height:21px;margin:10px 0 -7px;color:var(--muted);font-size:13px;line-height:1.6}.status.connected{border-color:color-mix(in srgb,var(--success) 45%,var(--border));background:color-mix(in srgb,var(--success) 10%,transparent);color:var(--success)}
    @media(prefers-color-scheme:dark){:root{--bg:#111412;--surface:rgba(25,29,26,.9);--solid:#0e0d0a;--inset:#222721;--text:#f3f1e9;--muted:#b0b8b0;--border:#343b33;--accent-hover:#e3b866;--success:#8ed3a8;--shadow:0 30px 90px -38px rgba(0,0,0,.9)}body{background:radial-gradient(circle at 15% 18%,rgba(207,152,60,.13),transparent 30rem),radial-gradient(circle at 88% 80%,rgba(142,211,168,.07),transparent 28rem),var(--bg)}}
    @media(max-width:480px){main{border-radius:22px}.offline-header{margin-bottom:18px}.privacy{padding:13px 14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <svg class="network" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1"><path d="M-40 220 190 105l184 112 190-92 222 126 224-132 240 120"/><path d="M-50 650 170 540l196 118 203-102 196 96 236-127 238 116"/><path d="m190 105-20 435m204-323-8 441m198-533 5 431m217-305-21 401m245-533-9 406" opacity=".52"/></g>
    <g fill="currentColor"><circle cx="190" cy="105" r="4"/><circle cx="374" cy="217" r="4"/><circle cx="564" cy="125" r="4"/><circle cx="786" cy="251" r="4"/><circle cx="1010" cy="119" r="4"/><circle cx="170" cy="540" r="4"/><circle cx="366" cy="658" r="4"/><circle cx="569" cy="556" r="4"/><circle cx="765" cy="652" r="4"/><circle cx="1001" cy="525" r="4"/></g>
  </svg>
  <main aria-labelledby="offline-title">
    <div class="offline-header">
      <div class="brand"><img src="/logo.png" alt="OBAOL"></div>
      <div id="connection-status" class="status" role="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="status-label">Connection interrupted</span></div>
    </div>
    <h1 id="offline-title">You’re offline</h1>
    <p class="lead">Reconnect to continue working in your OBAOL workspace. We’ll bring you back automatically as soon as your connection returns.</p>
    <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg><span>Your private company and transaction data is never stored for offline use.</span></div>
    <button id="retry-button" type="button">Try again</button>
    <p id="retry-feedback" class="feedback" role="status" aria-live="polite"></p>
  </main>
  <script>
    (()=>{const button=document.getElementById("retry-button");const feedback=document.getElementById("retry-feedback");const status=document.getElementById("connection-status");const statusLabel=document.getElementById("status-label");let reloadScheduled=false;const reloadWhenConnected=()=>{if(reloadScheduled)return;reloadScheduled=true;status.classList.add("connected");statusLabel.textContent="Connection restored";feedback.textContent="You’re back online. Reloading your workspace…";button.textContent="Reconnecting…";button.disabled=true;window.setTimeout(()=>window.location.reload(),700)};button.addEventListener("click",()=>{button.textContent="Checking connection…";button.disabled=true;feedback.textContent="";if(navigator.onLine){reloadWhenConnected();return}window.setTimeout(()=>{feedback.textContent="Still offline. Check your connection and try again.";button.textContent="Try again";button.disabled=false},500)});window.addEventListener("online",reloadWhenConnected)})();
  </script>
</body>
</html>
